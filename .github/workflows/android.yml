name: Build & test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.SILAH_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (selection logic, reminder, backup, stats)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug APK
        run: ./gradlew assembleDebug

      # Signed release APK — only when the signing secrets exist in the repo settings.
      # (Settings → Secrets and variables → Actions; see README, developer section.)
      - name: Signed release APK
        env:
          SILAH_KEYSTORE_PASSWORD: ${{ secrets.SILAH_KEYSTORE_PASSWORD }}
          SILAH_KEY_ALIAS: ${{ secrets.SILAH_KEY_ALIAS }}
          SILAH_KEY_PASSWORD: ${{ secrets.SILAH_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/silah.jks"
          SILAH_KEYSTORE_FILE="$RUNNER_TEMP/silah.jks" ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: silah-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
